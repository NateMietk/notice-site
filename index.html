<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notice</title>
<style>
  :root { --bg:#EEF1F6; --ink:#18223A; --muted:#5E6880; --dawn:#E79A3F; --night:#1C2B4A; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F1729; --ink:#E8ECF4; --muted:#9AA4BA; --dawn:#F0A955; --night:#0A1222; } }
  body { margin:0; background:var(--bg); color:var(--ink); font: 17px/1.55 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  header { background:var(--night); color:#F4F6FA; padding:28px 16px 22px; border-bottom:3px solid var(--dawn); }
  header h1 { margin:0; font: 600 28px/1.2 Georgia, "Times New Roman", serif; }
  header p { margin:6px 0 0; color:#B9C3D8; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
  a { color: var(--ink); }
</style>
</head>
<body>
<header><h1>Notice</h1><p>Evenings &amp; mornings, one night at a time</p></header>
<main>
  <p>Notice is an iPhone journal for the evening, the night, and the morning after. Everything you log stays on your phone.</p>
  <p><a href="support.html">Support</a> · <a href="privacy.html">Privacy policy</a> · <a href="mailto:noticeapp.support@gmail.com">noticeapp.support@gmail.com</a></p>
</main>
</body>
</html>
